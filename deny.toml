[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled in by ab_glyph; this is an unmaintained notice rather than a vulnerability, and no safe upgrade is available." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# The app never talks to the network. Anything that could is a build failure.
deny = [
    { crate = "attohttpc" },
    { crate = "curl" },
    { crate = "h2" },
    { crate = "http" },
    { crate = "hyper" },
    { crate = "isahc" },
    { crate = "mio" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "reqwest" },
    { crate = "ring" },
    { crate = "rustls" },
    { crate = "self_update" },
    { crate = "sentry" },
    { crate = "socket2" },
    { crate = "surf" },
    { crate = "tokio" },
    { crate = "tungstenite" },
    { crate = "ureq" },
    { crate = "webview2" },
    { crate = "webview2-com" },
    { crate = "wry" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
